services:
  postgres:
    container_name: htx-task-assignment-postgres-dev
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_assignment
      POSTGRES_USER: task_assignment_user
      POSTGRES_PASSWORD: task_assignment_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U task_assignment_user -d task_assignment"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  flyway:
    image: flyway/flyway:10-alpine
    platform: linux/amd64
    command: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/task_assignment
      FLYWAY_USER: task_assignment_user
      FLYWAY_PASSWORD: task_assignment_password
      FLYWAY_LOCATIONS: filesystem:/flyway/sql,filesystem:/flyway/seed
    volumes:
      - ../../backend/database/migrations:/flyway/sql:ro
      - ../../backend/database/seed:/flyway/seed:ro
  backend:
    container_name: htx-task-assignment-backend-dev
    image: htx-task-assignment-backend:latest
    env_file:
      - .env.backend-dev
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
  frontend:
    container_name: htx-task-assignment-frontend-dev
    image: htx-task-assignment-frontend:latest
    ports:
      - "81:80"
    depends_on:
      - backend

volumes:
  postgres_data: